# Pins the app to the dark palette the UI is designed against. Without this, a viewer
# whose Streamlit is set to light renders dark text on the dark panels defined in
# app.py, which makes the text unreadable.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#151922"
textColor = "#E8ECF4"
font = "sans serif"

[browser]
gatherUsageStats = false
